[project]
name = "ml-notebook"
version = "0.1.0"
description = "A learning-oriented collection of Jupyter notebooks exploring core machine learning concepts from a mathematically grounded, first-principles perspective, with emphasis on theoretical understanding, optimization, information theory, and principled PyTorch implementations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imageio[ffmpeg]>=2.37.2",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pyitlib>=0.3.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "einops>=0.8.0",
    "rotary-embedding-torch>=0.8.9",
    "jaxtyping>=0.3.9",
    "ipywidgets>=8.1.8",
    "python-dotenv>=1.2.2",
]

[tool.ruff.lint]
ignore = ["F722"]  # jaxtyping shape strings are not valid Python expressions

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]




